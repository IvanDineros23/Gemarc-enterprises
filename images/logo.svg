  </g>
  
  <!-- Company name -->
  <text x="80" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2e7d32">GEMARC</text>
  <text x="80" y="50" font-family="Arial, sans-serif" font-size="12" fill="#2e7d32">ENTERPRISES INCORPORATED</text>
  
