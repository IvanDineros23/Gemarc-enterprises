  <polygon points="15,65 25,45 35,65" fill="#4caf50"/>
  <polygon points="35,65 45,45 55,65" fill="#4caf50"/>
  
  <!-- Sun rays -->
  <g transform="translate(40,25)" fill="#ffd700">
    <polygon points="0,-8 2,-15 -2,-15"/>
    <polygon points="6,-6 12,-10 8,-14"/>
    <polygon points="8,0 15,-2 15,2"/>
    <polygon points="6,6 12,10 8,14"/>
